<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Infinite Trading Backoffice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css?v=20260927fixscroll" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#131a22" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Infinite Trading" />
  <link rel="apple-touch-icon" href="/images/app-icon.jpg" />
</head>

<body class="auth-page-body">
  <!-- Floating Theme Switcher -->
  <div style="position:fixed;top:16px;right:16px;z-index:999;">
    <button class="btn-theme-toggle" type="button" data-theme-toggle aria-label="Toggle Light/Dark Theme"
      title="Toggle Light/Dark Theme">
      <span class="theme-toggle-icon"></span>
      <span class="theme-toggle-text">Light</span>
    </button>
  </div>
  <!-- Animated ambient background mesh orbs -->
  <div class="orbs" aria-hidden="true">
    <span class="orb-1"></span>
    <span class="orb-2"></span>
    <span class="orb-3"></span>
  </div>

  <!-- Interactive Ambient Mouse Glow Element -->
  <div class="auth-ambient-glow" id="ambientGlow"></div>

  <div class="auth-shell">
    <!-- Left: Brand Showcase & Live Activity -->
    <aside class="auth-art">
      <a class="auth-logo-interactive" href="/" title="Infinite Trading Home">
        <img src="/images/site-logo.png?v=20260924gold" alt="Infinite Trading"
          style="max-width:320px;width:100%;height:auto;display:block;" />
      </a>
      <div class="auth-art-copy">
        <span class="pill open" style="margin-bottom:8px;font-size:11px;letter-spacing:0.12em;font-weight:700;">●
          BACKOFFICE DESK</span>
        <h2 style="font-size:36px;margin:8px 0 10px;line-height:1.2;">Sign in and the desks light up.</h2>
        <p class="muted" style="font-size:14px;max-width:36ch;margin:0 auto;line-height:1.6;">
          Real-time binary tree visualizer, matching pairs, and daily Trade-In cycle yield in one desk session.
        </p>
      </div>
    </aside>

    <!-- Right: Interactive Glassmorphism Login Card -->
    <section class="auth-form-wrap">
      <div class="auth-card" id="authCard">
        <!-- Interactive Button Redirection Tab -->
        <div class="auth-switcher">
          <a href="/login.html" class="auth-switcher-btn active" id="btnNavSignIn">Sign In</a>
          <a href="/register.html" class="auth-switcher-btn" id="btnNavCreateAccount">Create Account</a>
        </div>

        <div style="margin-bottom:20px;">
          <h1 style="font-size:28px;margin:0 0 6px;color:var(--text);">Welcome back</h1>
          <p class="muted" style="font-size:13px;margin:0;">
            Enter your mobile number or username to access your desk.
          </p>
        </div>

        <p id="error" class="err" style="margin-bottom:16px;"></p>

        <form id="form" autocomplete="off">
          <!-- Invisible dummy inputs to absorb aggressive browser autofill -->
          <div
            style="position:absolute;left:-9999px;top:-9999px;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden;"
            aria-hidden="true">
            <input type="text" name="fake_username_trap" tabindex="-1" autocomplete="off" />
            <input type="password" name="fake_password_trap" tabindex="-1" autocomplete="new-password" />
          </div>

          <!-- Field 1: Username -->
          <div class="auth-field-group">
            <label class="auth-field-label" for="login_mobile">
              <span>USERNAME</span>
              <span class="auth-field-status" id="mobileStatusCheck">✓ Ready</span>
            </label>
            <div class="auth-field-inner">
              <span class="auth-field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg></span>
              <input id="login_mobile" name="desk_login_id" class="auth-input" type="text" autocomplete="chrome-off"
                autocorrect="off" autocapitalize="off" spellcheck="false" required placeholder="Enter your username"
                readonly onfocus="this.removeAttribute('readonly')" />
            </div>
          </div>

          <!-- Field 2: Password -->
          <div class="auth-field-group">
            <div class="auth-field-label">
              <label for="login_password">PASSWORD</label>
              <span id="capsNotice" class="tiny" style="color:var(--gold);display:none;font-weight:700;"><svg width="12"
                  height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px;margin-right:2px;">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                  </path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg> CapsLock is ON</span>
            </div>
            <div class="auth-field-inner">
              <span class="auth-field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg></span>
              <input id="login_password" name="desk_secret_key" class="auth-input" type="password"
                autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" required
                placeholder="Enter your password" style="padding-right:42px;" readonly
                onfocus="this.removeAttribute('readonly')" />
              <button type="button" class="auth-toggle-pwd" id="btnTogglePwd" title="Show/Hide Password"
                aria-label="Toggle password visibility" style="font-size:12px;font-weight:600;letter-spacing:0.02em;">
                SHOW
              </button>
            </div>
          </div>

          <!-- Interactive Submit Button -->
          <button class="auth-submit-btn" id="submitBtn" style="margin-top:20px;">
            <span id="submitBtnText">Sign In to Backoffice</span>
            <span id="submitArrow" style="font-size:16px;">➔</span>
          </button>

        </form>
      </div>
    </section>
  </div>

  <script>
    // 1. Session Redirect if already authenticated
    const token = localStorage.getItem('it_token');
    if (token) {
      fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } })
        .then((r) => r.json())
        .then((d) => {
          if (d.user) location.href = d.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
        })
        .catch(() => { });
    }

    // 2. Interactive Ambient Cursor Light
    const glowEl = document.getElementById('ambientGlow');
    if (glowEl) {
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let curX = mouseX;
      let curY = mouseY;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      function animateGlow() {
        curX += (mouseX - curX) * 0.12;
        curY += (mouseY - curY) * 0.12;
        glowEl.style.left = curX + 'px';
        glowEl.style.top = curY + 'px';
        requestAnimationFrame(animateGlow);
      }
      animateGlow();
    }

    // 3. Elements & Autofill Guard
    const mobInput = document.getElementById('login_mobile');
    const pwdInput = document.getElementById('login_password');
    const statusCheck = document.getElementById('mobileStatusCheck');
    const capsNotice = document.getElementById('capsNotice');
    const btnToggle = document.getElementById('btnTogglePwd');
    const cardEl = document.getElementById('authCard');
    const submitBtn = document.getElementById('submitBtn');
    const submitText = document.getElementById('submitBtnText');
    const submitArrow = document.getElementById('submitArrow');
    const errEl = document.getElementById('error');

    let userHasTyped = false;
    mobInput.addEventListener('keydown', () => { userHasTyped = true; });
    pwdInput.addEventListener('keydown', () => { userHasTyped = true; });
    mobInput.addEventListener('paste', () => { userHasTyped = true; });
    pwdInput.addEventListener('paste', () => { userHasTyped = true; });

    // Remove readonly attribute when user focuses to allow immediate typing
    mobInput.addEventListener('focus', function () {
      this.removeAttribute('readonly');
    });
    pwdInput.addEventListener('focus', function () {
      this.removeAttribute('readonly');
    });

    const wipeAutofill = () => {
      if (!userHasTyped) {
        if (mobInput.value || pwdInput.value) {
          mobInput.value = '';
          pwdInput.value = '';
          mobInput.classList.remove('is-valid');
          statusCheck.classList.remove('show');
        }
      }
    };

    window.addEventListener('pageshow', () => {
      userHasTyped = false;
      mobInput.value = '';
      pwdInput.value = '';
    });
    window.addEventListener('DOMContentLoaded', wipeAutofill);
    window.addEventListener('load', () => {
      wipeAutofill();
      setTimeout(wipeAutofill, 60);
      setTimeout(wipeAutofill, 200);
      setTimeout(wipeAutofill, 500);
    });

    // 4. Live Username Input Feedback
    mobInput.addEventListener('input', () => {
      const val = mobInput.value.trim();
      if (val.length >= 3) {
        mobInput.classList.add('is-valid');
        statusCheck.classList.add('show');
        statusCheck.textContent = '✓ Ready';
      } else {
        mobInput.classList.remove('is-valid');
        statusCheck.classList.remove('show');
      }
    });

    // 5. Show / Hide Password Toggle
    btnToggle.addEventListener('click', () => {
      pwdInput.removeAttribute('readonly');
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      btnToggle.textContent = isPwd ? 'HIDE' : 'SHOW';
      btnToggle.title = isPwd ? 'Hide Password' : 'Show Password';
      pwdInput.focus();
    });

    // 6. CapsLock Detection
    pwdInput.addEventListener('keyup', (e) => {
      if (e.getModifierState && e.getModifierState('CapsLock')) {
        capsNotice.style.display = 'inline-block';
      } else {
        capsNotice.style.display = 'none';
      }
    });

    // 8. Form Submission with Interactive Loading & Shake Animation
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      errEl.classList.remove('show');
      cardEl.classList.remove('shake');

      const mobileVal = mobInput.value.trim();
      const pwdVal = pwdInput.value;

      submitBtn.disabled = true;
      submitText.textContent = 'Authenticating...';
      submitArrow.textContent = '...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: mobileVal, mobile_number: mobileVal, password: pwdVal }),
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Sign in failed. Please check credentials.';
          errEl.classList.add('show');
          cardEl.classList.add('shake');
          setTimeout(() => cardEl.classList.remove('shake'), 500);
          submitBtn.disabled = false;
          submitText.textContent = 'Sign In to Backoffice';
          submitArrow.textContent = '➔';
          return;
        }

        submitText.textContent = 'Success! Entering Desk...';
        submitArrow.textContent = '✓';
        submitBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';

        localStorage.setItem('it_token', data.token);
        setTimeout(() => {
          location.href = data.user.role === 'admin' ? '/admin.html' : '/dashboard.html';
        }, 400);
      } catch (err) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.add('show');
        submitBtn.disabled = false;
        submitText.textContent = 'Sign In to Backoffice';
      }
    });

  </script>
</body>

</html>
